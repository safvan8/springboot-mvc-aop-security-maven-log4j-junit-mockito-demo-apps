# ————————————————————————————————————————————————————————————————
# 1. Point Spring Boot’s auto-configured DataSource at your MySQL database
# ————————————————————————————————————————————————————————————————
spring.datasource.url=jdbc:mysql://localhost:3306/batch
spring.datasource.username=root
spring.datasource.password=Safvan@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ————————————————————————————————————————————————————————————————
# 2. Tell Spring Batch to always run the schema DDL on startup
#    (this will drop/re-create all BATCH_* tables in the 'batch' schema)
# ————————————————————————————————————————————————————————————————
spring.batch.initialize-schema=always

# ————————————————————————————————————————————————————————————————
# 3. (Optional) Prevent Spring Batch from auto-launching jobs if you only
#    want to create the tables without running any actual job at startup
# ————————————————————————————————————————————————————————————————
spring.batch.job.enabled=false

# Point Spring Boot's DataSource at the 'batch' database
spring.datasource.url=jdbc:mysql://localhost:3306/batch
spring.datasource.username=root
spring.datasource.password=Safvan@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Do NOT auto-drop/create Spring Batch tables (we only need PRODTAB)
spring.batch.jdbc.initialize-schema=never

# Let Spring Batch run jobs automatically on startup
spring.batch.job.enabled=false

# (Optional) Show SQL statements and batch logs in the console
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.batch=DEBUG
